services:
  flaskfarm-dev:
    # 로컬 빌드를 직접 테스트할 때만 아래 build 설정을 사용하세요.
    # build:
    #   context: .
    #   no_cache: true
    #   network: host
    image: ghcr.io/halfaider/flaskfarm-dev:latest
    container_name: flaskfarm-dev
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    volumes:
      - ${YOUR_FOLDER}/projects:/projects
    environment:
      PUID: ${YOUR_PUID}
      PGID: ${YOUR_PGID}
      TZ: Asia/Seoul
      #SSH_PASSWORD: ${YOUR_SSH_PASSWORD} # default: flaskfarm
